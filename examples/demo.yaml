# devwatch demo: every value kind without Docker or Postgres. It watches shell commands, devwatch's own
# web server, and devwatch's own SQLite history.
#
#   go run . -c examples/demo.yaml         serves the dashboard on http://127.0.0.1:7777
#   go run . check -c examples/demo.yaml   one pass; exits 1 because some watchers are crit or error on purpose
#                                          (and the SQLite ones fail until the dashboard has created its history)
#
# For containers, add e.g.  - name: my stack
#                             docker: {compose: my-project}
title: devwatch demo
every: 3s

watch:
  - name: random number
    group: numbers
    cmd: echo $(( $(od -An -N1 -tu1 /dev/urandom) % 30 ))
    unit: points
    warn: "> 18"
    crit: "> 27"

  - name: seconds
    group: numbers
    cmd: date +%S
    every: 1s

  - name: processes
    group: numbers
    cmd: ps -A | wc -l
    unit: processes
    expect: "> 0"

  - name: clock
    group: text
    cmd: date +%H:%M

  - name: kernel
    group: text
    cmd: uname -a
    match: '^(\S+)'

  - name: tick
    group: structured
    cmd: |
      printf '{"tick": %d, "parity": "%s", "arch": "%s"}' "$(( $(date +%s) % 10 ))" "$( [ $(( $(date +%s) % 2 )) -eq 0 ] && echo even || echo odd )" "$(uname -m)"

  - name: tick value
    group: structured
    cmd: |
      printf '{"build": {"tick": %d}}' "$(( $(date +%s) % 10 ))"
    value: build.tick

  - name: services
    group: structured
    as: table
    cmd: printf 'name\tstate\napi\trunning\nworker\t%s\n' "$( [ $(( $(date +%s) % 20 )) -lt 10 ] && echo running || echo stopped )"

  - name: devwatch port
    group: probes
    port: 127.0.0.1:7777

  - name: devwatch page
    group: probes
    http: http://127.0.0.1:7777/

  - name: stored checks
    group: sqlite
    sql: SELECT count(*) FROM sample
    dsn: sqlite:.devwatch/data.db # devwatch's own history; any SQLite file works, opened read-only
    unit: checks

  - name: seconds watcher
    group: sqlite
    sql: SELECT key, name, source FROM watcher WHERE key = 'seconds'
    dsn: sqlite:.devwatch/data.db

  - name: watchers by source
    group: sqlite
    sql: SELECT source, count(*) AS watchers FROM watcher GROUP BY source ORDER BY source
    dsn: sqlite:.devwatch/data.db

  - name: slow command
    group: errors
    cmd: sleep 10
    timeout: 1s

  - name: failing command
    group: errors
    cmd: echo "connection refused" >&2; exit 2
